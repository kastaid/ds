services:
  ds:
    build:
      context: .
      dockerfile: Dockerfile
    image: ds:latest
    container_name: ds-${COMPOSE_PROJECT_NAME}
    init: true
    restart: unless-stopped
    
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    env_file:
      - .env
    network_mode: bridge
